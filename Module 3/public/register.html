<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-lines">

<header class="site-header">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <span class="stamp"><span>Ink</span></span>
      <span class="brand-text">Inkwell<small>a ledger for writers</small></span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primary-nav"></nav>
  </div>
</header>

<main class="page-main">
  <div class="auth-shell">
    <div class="auth-card">
      <span class="stamp"><span>01</span></span>
      <h1>Create an account</h1>
      <p class="sub">Get your own shelf on the ledger.</p>

      <div class="form-msg" id="form-msg"></div>

      <form id="register-form" novalidate>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jordan Kim" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>

        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required>

        <button type="submit" class="btn btn-accent btn-block">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">Inkwell — a front-end demo blog application. Data lives in your browser only.</div>
</footer>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    initNav("register");
  });
</script>
</body>
</html>
