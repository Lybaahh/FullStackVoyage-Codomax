<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile — Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-lines">

<header class="site-header">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <span class="stamp"><span>Ink</span></span>
      <span class="brand-text">Inkwell<small>a ledger for writers</small></span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primary-nav"></nav>
  </div>
</header>

<main class="page-main">
  <div class="auth-shell">
    <div class="auth-card">
      <span class="stamp"><span id="profile-avatar">W</span></span>
      <h1>Your profile</h1>
      <p class="sub">Update your name, email, or password.</p>

      <div class="form-msg" id="profile-msg"></div>

      <form id="profile-form" novalidate>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <button type="submit" class="btn btn-accent btn-block">Save changes</button>
      </form>

      <hr style="margin:28px 0; border:none; border-top:1px solid var(--line);">

      <h1 style="font-size:1.2rem;">Change password</h1>
      <p class="sub">Use a password you're not using elsewhere.</p>

      <div class="form-msg" id="password-msg"></div>

      <form id="password-form" novalidate>
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" name="currentPassword" placeholder="••••••••" required>

        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" required>

        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>

        <button type="submit" class="btn btn-outline btn-block">Update password</button>
      </form>

      <p class="auth-switch" style="margin-top:20px;">
        <a href="#" id="logout-link">Log out</a>
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">Inkwell — Inspiring minds through the power of reading and stories.</div>
</footer>

<script src="js/app.js"></script>
<script src="js/profile.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    initNav("profile");
  });
</script>
</body>
</html>
